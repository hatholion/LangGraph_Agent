services:

  postgres:
    image: postgres:16
    container_name: postgres

    restart: unless-stopped

    #environment:
    # POSTGRES_USER: ${POSTGRES_USER:-postgres}      # - 는 포함하지 말 것.
    # POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    # POSTGRES_DB: ${POSTGRES_DB:-ragdb}

    # 계정(POSTGRES_USER/PASSWORD)과 DB(POSTGRES_DB) 설정은 .env 파일에서 읽어온다.
    # 최초 기동(볼륨이 비어있을 때)에 이 계정과 DB를 자동으로 만든다.
    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:        # 저장 위치
      - postgres_storage:/var/lib/postgresql/data

volumes:
  postgres_storage:
